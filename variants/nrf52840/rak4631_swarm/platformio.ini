; ECE455 LoRa Swarm Data Logger node: RAK4631 on a RAK19001 base.
; Bus plan: SX1262 on internal SPI, RAK12500 GNSS + RAK1906 + RAK12002 on I2C1, Y4000 sonde on Serial1 via RAK5802.
[env:rak4631_swarm]
custom_meshtastic_hw_model = 9
custom_meshtastic_hw_model_slug = RAK4631
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = RAK4631 Swarm Data Logger

extends = nrf52840_base
board = wiscore_rak4631
board_level = extra
build_type = release
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/rak4631_swarm
  -D RAK_4631
  -DMESHTASTIC_USE_EINK_UI=0
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  ; Serial1 belongs to the sonde; the Serial module would otherwise be able to claim it.
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  ; Every freshly flashed node joins the swarm on 915 MHz without manual setup (applies to new/reset configs only).
  -DUSERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_US
  -DUSERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_LONG_FAST
  ; Set to 1 to send synthetic sonde readings (tagged "sim":1) for bench-testing the dashboard.
  -DSONDE_SIMULATE=0
  ; Sensor power schedule: the IO3 MOSFET switches the sensors on for 3 min every 30 min (27 min off), and they are
  ; read 2 min after power-on so the Y4000 and weather station have stabilised.
  -DSENSOR_CYCLE_SECS=1800
  -DSENSOR_ON_SECS=180
  -DSENSOR_WARMUP_SECS=120
build_src_filter = ${nrf52_base.build_src_filter} \
  +<../variants/nrf52840/rak4631_swarm> \
  -<graphics/EInkDisplay2.cpp> \
  -<graphics/EInkDynamicDisplay.cpp> \
  -<graphics/fonts/EinkDisplayFonts.cpp>
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0
  # renovate: datasource=custom.pio depName=RAK NCP5623 RGB LED packageName=rakwireless/library/RAKwireless NCP5623 RGB LED library
  rakwireless/RAKwireless NCP5623 RGB LED library@1.0.3
  # renovate: datasource=custom.pio depName=RAK12035_SoilMoisture packageName=beegee-tokyo/library/RAK12035_SoilMoisture
  beegee-tokyo/RAK12035_SoilMoisture@1.0.4
  # DS18B20 temperature string
  # renovate: datasource=custom.pio depName=OneWire packageName=paulstoffregen/library/OneWire
  paulstoffregen/OneWire@2.3.8
  # renovate: datasource=custom.pio depName=DallasTemperature packageName=milesburton/library/DallasTemperature
  milesburton/DallasTemperature@4.0.6
